version: 2
updates:
  # Python: no version-bump pull requests. They would only raise the minimum versions in requirements.txt (and invite surprise major
  # upgrades); security updates still arrive.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  # GitHub Actions: minor and patch updates only, grouped into one monthly pull request. A new major version of an action is a
  # deliberate change, made by hand after reading its release notes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
