<!doctype html>
<!-- YouTube thumbnail (1280x720). Edit, then screenshot this page at 1280x720. Fonts are the app's own (SIL OFL). --><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Fraunces";src:url("../../web/vendor/fonts/fraunces-latin-opsz-normal.woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:"Fraunces";src:url("../../web/vendor/fonts/fraunces-latin-opsz-italic.woff2");font-weight:100 900;font-style:italic}
@font-face{font-family:"Hanken";src:url("../../web/vendor/fonts/hanken-grotesk-latin-wght-normal.woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;background:#070a18;font-family:"Hanken",system-ui,sans-serif;color:#f4f6ff;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(700px 520px at 88% 96%,rgba(255,138,118,.55),transparent 70%),
 radial-gradient(640px 520px at 6% 4%,rgba(47,212,200,.38),transparent 70%),
 radial-gradient(760px 600px at 62% 36%,rgba(91,108,255,.42),transparent 72%),
 radial-gradient(500px 420px at 40% 100%,rgba(160,110,255,.35),transparent 70%),
 linear-gradient(160deg,#080c1c,#12204a)}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.chip{position:absolute;left:64px;top:36px;display:inline-flex;gap:10px;align-items:center;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);font-weight:700;font-size:25px;letter-spacing:.14em;text-transform:uppercase;color:#dfe4ff}
.chip i{width:12px;height:12px;border-radius:50%;background:#ff9a86;box-shadow:0 0 14px #ff9a86}
h1{position:absolute;left:52px;top:84px;font-family:"Fraunces",Georgia,serif;font-weight:360;font-size:158px;line-height:.9;letter-spacing:-.045em;text-shadow:0 6px 40px rgba(0,0,0,.45)}
h1 em{display:block;margin-top:2px;margin-left:-6px;font-style:italic;font-weight:330;font-size:200px;line-height:.95;color:#ff9a86;text-shadow:0 0 60px rgba(255,138,118,.6)}
.sub{position:absolute;left:64px;bottom:30px;display:flex;gap:14px;align-items:center}
.pill{padding:14px 26px;border-radius:18px;font-weight:800;font-size:34px;background:rgba(255,255,255,.96);color:#0a0f24;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pill.sm{font-size:26px;padding:16px 22px;font-weight:700}
.pill.t{background:linear-gradient(135deg,#46e0b8,#2fd4c8);}
.glass{position:absolute;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.3);box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);backdrop-filter:blur(18px)}
.ring{right:44px;top:30px;width:270px;height:270px;border-radius:50%;display:grid;place-items:center;transform:rotate(5deg)}
.ring svg{position:absolute;inset:14px}
.ring b{font-family:"Fraunces",serif;font-weight:330;font-size:124px;line-height:1;letter-spacing:-.04em}
.ring small{position:absolute;bottom:52px;font-weight:700;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:#ffd8d1}
.card{width:480px;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.card h3{font-family:"Fraunces",serif;font-weight:420;font-size:31px;line-height:1.05;letter-spacing:-.02em}
.card p{margin-top:8px;font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:#ffd8d1}
.card .amt{font-family:"Fraunces",serif;font-size:48px;font-weight:420;color:#46e0b8;white-space:nowrap}
.c1{right:30px;top:306px;transform:rotate(-3deg)}
.c2{right:22px;top:418px;transform:rotate(2.5deg)}
.c3{right:34px;top:528px;transform:rotate(-1.5deg);border-color:rgba(255,138,118,.85);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 60px rgba(255,138,118,.45)}
.tag{position:absolute;right:300px;top:238px;padding:8px 16px;border-radius:12px;font-weight:800;font-size:24px;background:#ff9a86;color:#2a0a05;transform:rotate(-6deg);box-shadow:0 8px 26px rgba(0,0,0,.4)}
.note{position:absolute;right:30px;bottom:12px;font-size:17px;color:rgba(223,228,255,.7);font-weight:600}
</style></head><body>
<div class="bg"></div><div class="grain"></div>
<div class="chip"><i></i>PayPal AI Hackathon</div>
<h1>Your money<br>is leaving<em>quietly.</em></h1>
<div class="sub"><div class="pill t">$700 a year found</div><div class="pill sm">in a sample statement</div></div>
<div class="glass ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="#ff9a86" stroke-width="7" stroke-linecap="round" stroke-dasharray="124 277" transform="rotate(-90 50 50)" style="filter:drop-shadow(0 0 6px #ff9a86)"/></svg><b>45</b><small>Needs attention</small></div>
<div class="tag">7 findings</div>
<div class="glass card c1"><div><h3>Streamly: billed twice</h3><p>Duplicate</p></div><div class="amt">$100</div></div>
<div class="glass card c2"><div><h3>Netflix: price up 16%</h3><p>Price hike</p></div><div class="amt">$30</div></div>
<div class="glass card c3"><div><h3>FitPass: still charged after PayPal cancelled</h3><p>PayPal mismatch</p></div><div class="amt">$288</div></div>
</body></html>
